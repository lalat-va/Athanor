name: Deploy PWA to GitHub Pages

on:
  push:
    branches:
      - main # Esegue il deploy ogni volta che fai un push su "main"

# Permessi minimi richiesti per pubblicare su GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permette di annullare un deploy in corso se ne viene avviato uno più recente
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configurazione di Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Installazione delle dipendenze
        run: npm ci || npm install

      - name: Compilazione dell'applicazione (Build)
        run: npm run build

      - name: Configurazione dell'ambiente Pages
        uses: actions/configure-pages@v4

      - name: Caricamento dell'esito della compilazione (Artifact)
        uses: actions/upload-pages-artifact@v3
        with:
          # Carica la cartella compilata da Vite (di default si chiama "dist")
          path: './dist'

      - name: Deploy su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
